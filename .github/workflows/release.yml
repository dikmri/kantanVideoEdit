name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: false

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            name: linux
          - platform: windows-latest
            args: ""
            name: windows
          - platform: macos-13
            args: "--target x86_64-apple-darwin"
            name: macos-intel
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            name: macos-arm

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential curl wget file

      - name: Install FFmpeg (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y ffmpeg
          mkdir -p src-tauri/resources/bin
          cp $(which ffmpeg) src-tauri/resources/bin/ffmpeg
          cp $(which ffprobe) src-tauri/resources/bin/ffprobe

      - name: Install FFmpeg (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install ffmpeg
          mkdir -p src-tauri/resources/bin
          if [ -f /opt/homebrew/bin/ffmpeg ]; then
            cp /opt/homebrew/bin/ffmpeg src-tauri/resources/bin/ffmpeg
            cp /opt/homebrew/bin/ffprobe src-tauri/resources/bin/ffprobe
          else
            cp /usr/local/bin/ffmpeg src-tauri/resources/bin/ffmpeg
            cp /usr/local/bin/ffprobe src-tauri/resources/bin/ffprobe
          fi

      - name: Install FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          New-Item -ItemType Directory -Force -Path src-tauri\resources\bin | Out-Null
          $ff = (Get-Command ffmpeg).Source
          $fp = (Get-Command ffprobe).Source
          Copy-Item $ff src-tauri\resources\bin\ffmpeg.exe
          Copy-Item $fp src-tauri\resources\bin\ffprobe.exe

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Kantan Video Edit ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the latest build for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
