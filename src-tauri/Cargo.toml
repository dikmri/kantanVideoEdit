[package]
name = "kantan-video-edit"
version = "1.0.0"
description = "Kantan Video Edit - a fast, lightweight, cross-platform, multilingual video editor"
authors = ["dikmri"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kantan_video_edit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"
log = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
